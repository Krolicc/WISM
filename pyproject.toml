
[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Репозиторий для будущего проекта \"Интеллектуальная платформа для сквозной генерации мультимедийного повествовательного контента (комиксов/сторибордов) с использованием технологий генеративного ИИ\""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
pydantic-settings = "^2.3.0"
langchain-google-genai = "^4.2.0"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.4"}
alembic = "^1.18.4"
sqlalchemy = "^2.0.46"
aiosqlite = "^0.22.1"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
