
[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Репозиторий для будущего проекта \"Интеллектуальная платформа для сквозной генерации мультимедийного повествовательного контента (комиксов/сторибордов) с использованием технологий генеративного ИИ\""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
pydantic-settings = "^2.3.0"
langchain-google-genai = "^4.2.0"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.4"}
alembic = "^1.18.4"
sqlalchemy = "^2.0.46"
greenlet = "^3.3.1"
asyncpg = "^0.31.0"
celery = "^5.6.2"
redis = "^7.2.1"
chromadb-client = "^1.5.2"
onnxruntime = "^1.24.3"
tokenizers = "^0.22.2"
neo4j = "^6.1.0"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
