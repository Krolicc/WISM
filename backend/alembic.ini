# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template for migration file names
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering Alembic stamps
# timezone = UTC

# Post-write hook for migration files
# post_write_hooks = 

# sys.path path, will be prepended to sys.path if present.
# ideologies.py

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S

# Alembic-specific configuration
[alembic:exclude]
tables = 

# --- Database Connection ---
# This URL is for running Alembic from your host machine.
# It connects to the PostgreSQL instance running inside Docker.
# The values are taken from the `db` service in docker-compose.yml.
sqlalchemy.url = ${DATABASE_URL}
